name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake test:unit
      - name: Validate RBS
        if: matrix.ruby == '3.4'
        run: bundle exec rake rbs

  system:
    runs-on: ubuntu-24.04
    name: Linux ${{ matrix.kernel }} system tests
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - v6.1
          - v6.12
          - v6.14

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install VM runner
        run: sudo apt-get update && sudo apt-get install -y busybox-static qemu-system-x86 virtme-ng zstd
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run privileged tests in kernel VM
        timeout-minutes: 30
        run: vng -v -r ${{ matrix.kernel }} --user root -- env FANOTIFY_EXPECT_KERNEL=${{ matrix.kernel }} FANOTIFY_REQUIRE_PRIVILEGED=1 FANOTIFY_REQUIRE_PRE_ACCESS=${{ matrix.kernel == 'v6.14' && '1' || '0' }} bundle exec rake compile test:system

  portability:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake test:unit
